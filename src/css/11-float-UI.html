  <body>
    <h1>Float</h1>
    <div class="card good-partner">
      <div class="subject">
        <span>굿 파트너</span><span lang="en">(Good Partner)</span>
      </div>
      <div class="thumbnail">
        <img src="/src/assets/drama/good-partner-narrow.webp" alt="굿 파트너" />
      </div>
      <div class="content">
        차해영(장나라)과 노지석(남궁민)은 성격이 정반대인 변호사로, 우연히 같은
        로펌에서 일하게 된다. 처음에는 서로를 극도로 불편해하며 매일 다투지만,
        점점 협력하며 복잡한 사건들을 해결해 나간다. 해영은 지석의 냉철함에서,
        지석은 해영의 따뜻함에서 서로를 배우며 성장한다. 두 사람은 점점 서로에게
        끌리게 되고, 복잡한 감정을 품으며 로맨스가 시작된다. 결국 개인적,
        직업적으로 성장한 두 사람은 서로의 감정을 인정하고 함께 나아갈 결심을
        한다. 😊
      </div>
    </div>
